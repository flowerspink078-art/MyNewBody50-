  <style>
    :root {
      --deep: #1F201E;
      --deepmoss: #30352F;
      --sage: #A3AB96;
      --milk: #F3EEE5;
      --stone: #DBD6CE;
      --brass: #B89A5A;
      --success: #71866F;
      --warning: #B28A52;
      --error: #A85F52;
      --sage-soft: rgba(163,171,150,0.16);
      --milk-soft: rgba(243,238,229,0.10);
      --r-lg: 22px;
      --r-md: 16px;
      --r-pill: 999px;
      --fs-scale: 1;
    }
    
    body, html {
      margin: 0;
      padding: 0;
      background-color: var(--deep);
      color: var(--milk);
      font-family: 'Geologica', 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .tx-normal { --fs-scale: 0.92; }
    .tx-large { --fs-scale: 1; }
    .tx-max { --fs-scale: 1.18; }

    .r50-root {
      background: linear-gradient(160deg, var(--deep) 0%, var(--deepmoss) 100%);
      color: var(--milk);
      min-height: 100vh;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      position: relative;
      overflow-x: hidden;
      padding-bottom: calc(84px + env(safe-area-inset-bottom));
      font-size: calc(16px * var(--fs-scale));
      line-height: 1.5;
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }

    .r50-root * { box-sizing: border-box; }
    .r50-scroll { padding: 18px 16px 8px; }

    .eyebrow { font-size: calc(13px * var(--fs-scale)); letter-spacing: .04em; color: var(--stone); font-weight: 600; }
    .h1 { font-size: calc(26px * var(--fs-scale)); font-weight: 700; color: var(--milk); margin: 2px 0 4px; }
    .h2 { font-size: calc(20px * var(--fs-scale)); font-weight: 700; color: var(--milk); margin: 0 0 10px; }
    .muted { color: var(--stone); font-size: calc(15px * var(--fs-scale)); }
    .muted-dark { color: rgba(31,32,30,0.62); font-size: calc(15px * var(--fs-scale)); }

    .card-dark {
      background: linear-gradient(160deg, rgba(48,53,47,0.9), rgba(31,32,30,0.9));
      border: 1px solid var(--milk-soft);
      border-radius: var(--r-lg);
      padding: 18px;
      margin-bottom: 14px;
    }

    .card-light {
      background: var(--milk);
      color: var(--deep);
      border-radius: var(--r-lg);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    }

    .card-stone {
      background: var(--stone);
      color: var(--deep);
      border-radius: var(--r-md);
      padding: 14px 16px;
      margin-bottom: 10px;
    }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 52px; border-radius: var(--r-pill); border: none; cursor: pointer;
      font-family: inherit; font-weight: 700; font-size: calc(18px * var(--fs-scale));
      padding: 12px 22px; transition: transform .15s ease, opacity .15s ease;
      text-decoration: none;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary-dark { background: var(--sage); color: var(--deep); }
    .btn-primary-light { background: var(--deep); color: var(--milk); }
    .btn-ghost { background: transparent; color: var(--milk); border: 1px solid var(--milk-soft); }
    .btn-ghost-dark { background: transparent; color: var(--deep); border: 1px solid rgba(31,32,30,0.18); }
    .btn-danger { background: transparent; color: var(--error); border: 1px solid rgba(168,95,82,0.4); }
    .btn-sm { min-height: 44px; font-size: calc(15px * var(--fs-scale)); padding: 8px 16px; }

    .pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--r-pill);
      font-size: calc(14px * var(--fs-scale)); font-weight: 600; background: var(--sage-soft); color: var(--sage);
    }
    .pill-brass { background: rgba(184,154,90,0.16); color: var(--brass); }

    .tapzone { min-height: 48px; min-width: 48px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: inherit; cursor: pointer; }

    .bottomnav {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 460px;
      background: rgba(31,32,30,0.94); backdrop-filter: blur(14px);
      border-top: 1px solid var(--milk-soft);
      display: flex; justify-content: space-around;
      padding: 10px 6px calc(10px + env(safe-area-inset-bottom));
      z-index: 40;
    }
    .navitem { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--stone); background: none; border: none; font-family: inherit; min-width: 56px; min-height: 48px; cursor: pointer; transition: color .2s; }
    .navitem.active { color: var(--sage); }
    .navitem span { font-size: calc(12px * var(--fs-scale)); font-weight: 600; }

    .topbar {
      position: sticky; top: 0; z-index: 30; background: linear-gradient(180deg, var(--deep) 70%, rgba(31,32,30,0));
      padding: 14px 16px 6px; display: flex; align-items: center; gap: 10px;
    }
    .progressbar { height: 6px; border-radius: 6px; background: rgba(243,238,229,0.14); overflow: hidden; flex: 1; }
    .progressbar > div { height: 100%; background: var(--sage); border-radius: 6px; transition: width .3s ease; }

    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex-shrink: 0; padding: 10px 16px; border-radius: var(--r-pill); background: var(--milk-soft); color: var(--stone); font-weight: 600; border: none; font-family: inherit; font-size: calc(15px * var(--fs-scale)); cursor: pointer; min-height: 44px; }
    .tab.active { background: var(--sage); color: var(--deep); }

    .stepper { display: flex; align-items: center; gap: 16px; }
    .stepper button { width: 48px; height: 48px; border-radius: 50%; border: none; background: rgba(31,32,30,0.08); color: var(--deep); font-size: 22px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .stepper .val { font-size: calc(28px * var(--fs-scale)); font-weight: 700; min-width: 90px; text-align: center; }

    .setrow-done { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: var(--r-md); background: rgba(113,134,111,0.14); color: var(--milk); margin-bottom: 8px; font-size: calc(16px * var(--fs-scale)); font-weight: 600; }

    .choice-row { display: flex; flex-direction: column; gap: 10px; }
    .choice-btn-dark { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px 16px; border-radius: var(--r-md); border: 2px solid rgba(243,238,229,0.16); background: rgba(31,32,30,0.6); cursor: pointer; font-family: inherit; text-align: left; min-height: 56px; transition: all .2s; width: 100%; }
    .choice-btn-dark .lbl { font-weight: 700; font-size: calc(16px * var(--fs-scale)); color: var(--milk); display: flex; align-items: center; gap: 8px; }
    .choice-btn-dark .sub { font-size: calc(14px * var(--fs-scale)); color: rgba(243,238,229,0.7); }
    .choice-btn-dark.selected { border-color: var(--sage); background: rgba(163,171,150,0.18); }

    .input-field { width: 100%; border-radius: var(--r-md); border: 1px solid rgba(243,238,229,0.16); background: rgba(243,238,229,0.06); color: var(--milk); padding: 12px 14px; font-size: calc(16px * var(--fs-scale)); font-family: inherit; min-height: 48px; outline: none; }
    .input-field:focus { border-color: var(--sage); }
    .label-field { font-size: calc(14px * var(--fs-scale)); font-weight: 600; color: var(--stone); margin-bottom: 6px; display: block; }

    .bignum { font-size: calc(30px * var(--fs-scale)); font-weight: 700; }
    .goldnum { color: var(--brass); }

    .divider { height: 1px; background: var(--milk-soft); margin: 14px 0; }

    .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 60; display: flex; align-items: flex-end; backdrop-filter: blur(4px); }
    .sheet { background: var(--deepmoss); width: 100%; max-width: 460px; margin: 0 auto; border-radius: 24px 24px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); max-height: 85vh; overflow-y: auto; border-top: 1px solid var(--milk-soft); }

    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { padding: 9px 14px; border-radius: var(--r-pill); background: rgba(243,238,229,0.06); color: var(--stone); font-size: calc(14px * var(--fs-scale)); border: 1px solid var(--milk-soft); font-family: inherit; cursor: pointer; min-height: 40px; }
    .chip.active { background: var(--sage); color: var(--deep); border-color: var(--sage); }

    .linechart { width: 100%; height: 140px; }
    .avoid-line { color: var(--error); font-size: calc(15px * var(--fs-scale)); margin-bottom: 4px; }
  </style>
</head>

    ];

    function getPhase(week) {
      if (week <= 2) return { key: "early", label: "Недели 1–2 · базовый объём", rirTarget: "осталось 3", deloadFactor: 1 };
      if (week <= 4) return { key: "full", label: "Недели 3–4 · полный объём", rirTarget: "осталось 2", deloadFactor: 1 };
      if (week <= 8) return { key: "full_c9", label: "Недели 5–8 · полный объём + доп. трицепс", rirTarget: "осталось 2", deloadFactor: 1 };
      if (week <= 11) return { key: "progress", label: "Недели 9–11 · прогрессия веса", rirTarget: "1–2", deloadFactor: 1 };
      if (week === 12) return { key: "deload", label: "Неделя 12 · разгрузка", rirTarget: "легко / умеренно", deloadFactor: 0.6 };
      return { key: "optional", label: "Недели 13–16 · опционально", rirTarget: "осталось 2", deloadFactor: 1 };
    }

    function setsForExercise(ex, week) {
      const phase = getPhase(week);
      let base = week <= 2 ? ex.setsEarly : ex.setsFull;
      if (phase.key === "deload") {
        const m = base.match(/(\d+)/);
        if (m) {
          const n = Math.max(1, Math.round(parseInt(m[1], 10) * phase.deloadFactor));
          base = base.replace(/^\d+/, String(n));
        }
      }
      return base;
    }

    function exercisesForLetter(letter, week) {
      return PROGRAM[letter].exercises.filter((ex) => week >= ex.weekStart);

      const diffDays = Math.max(0, Math.floor((now - start) / 86400000));
      return Math.min(16, Math.floor(diffDays / 7) + 1);

    /* ЭКРАН ТРЕНИРОВКИ С РУЧНЫМ ДОБАВЛЕНИЕМ ДОПОЛНИТЕЛЬНЫХ СЕТОВ И ПОЛНОЦЕННЫМИ ЗАМЕНАМИ */
    function WorkoutSession({ state, setState, onExit }) {
      const session = state.activeSession;
      const week = session.week;
      const letter = session.letter;
      const exList = exercisesForLetter(letter, week);
      const exIndex = session.exerciseIndex;
      const ex = exList[exIndex];
      const exLog = session.log[ex.id] || { variantId: ex.id, sets: [], extraSets: 0 };
      
      const setsMatch = setsForExercise(ex, week).match(/(\d+)(?:\s*[×x]\s*(\d+)(?:–|-)?(\d+)?)?/);
      const baseTargetSets = setsMatch ? parseInt(setsMatch[1], 10) : 3;
      const targetSets = baseTargetSets + (exLog.extraSets || 0);
      const repMin = setsMatch && setsMatch[2] ? parseInt(setsMatch[2], 10) : 8;

      const [showTech, setShowTech] = useState(false);
      const [showReplace, setShowReplace] = useState(false);
      const [weight, setWeight] = useState(() => {
        const ww = state.workingWeights[exLog.variantId] || state.workingWeights[ex.id];
        return ww && ww.value != null ? ww.value : ww && ww.valueMin != null ? ww.valueMin : 0;
      });
      const [reps, setReps] = useState(repMin);
      const [feel, setFeel] = useState(null);
      const [rir, setRir] = useState(null);
      const [resting, setResting] = useState(false);
      const [restLeft, setRestLeft] = useState(0);

      const updateSession = (patch) => {
        setState((s) => ({ ...s, activeSession: { ...s.activeSession, ...patch } }));
      };

      const completeSet = () => {
        const newSet = { weight, reps, feel: feel || "Нормально", rir: rir == null ? 2 : rir, done: true };
        const newLog = { ...exLog, sets: [...exLog.sets, newSet] };
        updateSession({ log: { ...session.log, [ex.id]: newLog } });
        setFeel(null); setRir(null);
        setRestLeft(ex.isIsolation ? 60 : 90);
        setResting(true);
      };

      const addExtraSet = () => {
        const newLog = { ...exLog, extraSets: (exLog.extraSets || 0) + 1 };
        updateSession({ log: { ...session.log, [ex.id]: newLog } });
      };

      const applyReplacement = (alt) => {
        updateSession({ log: { ...session.log, [ex.id]: { variantId: alt.name, sets: [], extraSets: 0 } } });
        setShowReplace(false);
      };

      const doneCount = exLog.sets.length;
      const isExerciseDone = doneCount >= targetSets;
      const displayVariant = exLog.variantId !== ex.id ? exLog.variantId : ex.name;

      const goNextExercise = () => {
        if (exIndex + 1 < exList.length) {
          updateSession({ exerciseIndex: exIndex + 1 });
        } else {
          finishWorkout();
        }
      };

      const finishWorkout = () => {
        const record = { id: uid(), letter, date: todayISO(), week, exercises: session.log };
        setState((s) => ({
          ...s, workoutHistory: [...s.workoutHistory, record],
          cycleCount: s.cycleCount + 1, activeSession: null
        }));
      };

      return (
        <div className="r50-root">
          <div className="topbar">
            <button className="tapzone" onClick={onExit} aria-label="Закрыть"><Icon name="x" size={22} /></button>
            <div style={{ flex: 1 }}>
              <div className="muted" style={{ fontSize: "calc(13px * var(--fs-scale))" }}>Упражнение {exIndex + 1} из {exList.length}</div>
              <div className="progressbar" style={{ marginTop: 4 }}><div style={{ width: `${((exIndex) / exList.length) * 100}%` }} /></div>
            </div>
          </div>

          <div className="r50-scroll" style={{ paddingTop: 4 }}>
            <div className="card-dark">
              <div style={{ fontWeight: 700, fontSize: "calc(22px * var(--fs-scale))" }}>{displayVariant.toUpperCase()}</div>
              <div className="muted">{ex.target}</div>
              <div className="divider" />
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span>Цель:</span>
                <strong>{baseTargetSets}{exLog.extraSets ? `+${exLog.extraSets}` : ''} × {setsMatch ? setsMatch[2] : "8–12"}</strong>
              </div>
              <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
                <button className="btn btn-ghost btn-sm" onClick={() => setShowTech(true)}><Icon name="info" size={16} /> Техника</button>
                <button className="btn btn-ghost btn-sm" onClick={() => setShowReplace(true)}><Icon name="refresh" size={16} /> Заменить</button>
              </div>
            </div>

            <div style={{ marginTop: 10 }}>
              {exLog.sets.map((st, i) => (
                <div className="setrow-done" key={i}>
                  <span><Icon name="check" size={16} /> Подход {i + 1} · {st.weight} кг × {st.reps}</span>
                  <span className="muted" style={{ color: "var(--milk)" }}>осталось {st.rir}</span>
                </div>
              ))}
            </div>

            {!isExerciseDone && !resting && (
              <div className="card-light">
                <div className="eyebrow" style={{ color: "rgba(31,32,30,0.5)" }}>ПОДХОД {doneCount + 1} ИЗ {targetSets}</div>
                <div style={{ marginTop: 12 }}>
                  <label className="label-field" style={{ color: "rgba(31,32,30,0.6)" }}>Вес, кг</label>
                  <Stepper value={weight} onChange={setWeight} step={ex.isIsolation ? 1 : 2.5} min={0} />
                </div>
                <div style={{ marginTop: 14 }}>
                  <label className="label-field" style={{ color: "rgba(31,32,30,0.6)" }}>Повторы</label>
                  <Stepper value={reps} onChange={setReps} step={1} min={1} />
                </div>
                <div style={{ marginTop: 14 }}>
                  <label className="label-field" style={{ color: "rgba(31,32,30,0.6)" }}>Повторов в запасе?</label>
                  <div className="choice-row">
                    {RIR_OPTIONS.map((o) => (
                      <button key={o.value} className={`choice-btn-dark ${rir === o.value ? "selected" : ""}`} onClick={() => setRir(o.value)}>
                        <div className="lbl">{rir === o.value && <Icon name="check" size={16} />} {o.label} · {o.sub}</div>
                      </button>
                    ))}
                  </div>
                </div>
                <button className="btn btn-primary-light" style={{ width: "100%", marginTop: 18 }} onClick={completeSet}>
                  Завершить подход
                </button>
              </div>
            )}

            {resting && (
              <div className="card-dark" style={{ textAlign: "center" }}>
                <div className="muted">Отдых</div>
                <div className="bignum goldnum" style={{ fontSize: "calc(44px * var(--fs-scale))", margin: "8px 0" }}>{restLeft} сек</div>
                <button className="btn btn-primary-dark btn-sm" style={{ margin: "0 auto" }} onClick={() => setResting(false)}>Пропустить</button>
              </div>
            )}

            {isExerciseDone && !resting && (
              <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 14 }}>
                <button className="btn btn-ghost" onClick={addExtraSet}>
                  <Icon name="plus" size={18} /> Дополнительный подход
                </button>
                <button className="btn btn-primary-dark" style={{ width: "100%" }} onClick={goNextExercise}>
                  {exIndex + 1 < exList.length ? <>Следующее упражнение <Icon name="arrowRight" size={18} /></> : "Завершить тренировку"}
                </button>
              </div>
            )}
          </div>

          {showTech && <ExerciseInfoSheet ex={ex} activeVariantId={exLog.variantId} onClose={() => setShowTech(false)} />}

          {showReplace && (
            <div className="sheet-backdrop" onClick={() => setShowReplace(false)}>
              <div className="sheet" onClick={(e) => e.stopPropagation()}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
                  <div className="h2" style={{ marginBottom: 0 }}>Заменить упражнение</div>
                  <button className="tapzone" onClick={() => setShowReplace(false)}><Icon name="x" size={22} /></button>
                </div>
                {ex.alternatives.map((alt, i) => (
                  <button key={i} className="choice-btn-dark" style={{ width: "100%", marginBottom: 10 }} onClick={() => applyReplacement(alt)}>
                    <div className="lbl">{alt.name}</div>
                    {alt.note && <div className="sub">{alt.note}</div>}
                  </button>
                ))}
                <button className="choice-btn-dark" style={{ width: "100%", opacity: 0.7 }} onClick={() => applyReplacement({ name: ex.name })}>
                  <div className="lbl"><Icon name="refresh" size={16}/> Вернуть оригинал</div>
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function NutritionScreen({ state, setState }) {
      return <div className="r50-scroll"><div className="h1">Питание</div><div className="card-dark"><p className="muted">Цель: {state.nutritionGoals.protein}г белка, {state.nutritionGoals.calories} ккал</p></div></div>;
    }

    function ProgressScreen({ state }) {
      return <div className="r50-scroll"><div className="h1">Прогресс</div><div className="card-dark"><div className="muted">Всего тренировок: {state.workoutHistory.length}</div></div></div>;
    }

    function MoreScreen({ state, setState }) {
      return (
        <div className="r50-scroll">
          <div className="h1">Ещё</div>
          <div className="card-dark">
            <div style={{ fontWeight: 700 }}>{state.profile.name}, {state.profile.age} лет</div>
          </div>
          <div className="card-dark" onClick={() => { localStorage.removeItem(STORAGE_KEY); location.reload(); }} style={{ cursor: "pointer" }}>
            <span style={{ color: "var(--error)" }}>Сбросить все данные</span>
          </div>
        </div>
      );
    }

    function App() {
      const [state, setState] = useState(loadState);
      const [screen, setScreen] = useState("today");

      useEffect(() => { saveState(state); }, [state]);

      const startWorkout = (letter) => {
        const week = weekNumberFor(state);
        setState((s) => ({ ...s, activeSession: { letter, week, exerciseIndex: 0, log: {}, startedAt: Date.now() } }));
      };

      if (!state.onboarded) return <Onboarding state={state} setState={setState} />;
      if (state.activeSession) return <WorkoutSession state={state} setState={setState} onExit={() => setState((s) => ({ ...s, activeSession: null }))} />;

      return (
        <div className="r50-root">
          {screen === "today" && <TodayScreen state={state} setState={setState} startWorkout={startWorkout} />}
          {screen === "workouts" && <WorkoutsScreen state={state} setState={setState} startWorkout={startWorkout} />}
          {screen === "nutrition" && <NutritionScreen state={state} setState={setState} />}
          {screen === "progress" && <ProgressScreen state={state} setState={setState} />}
          {screen === "more" && <MoreScreen state={state} setState={setState} />}
          <BottomNav screen={screen} setScreen={setScreen} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
