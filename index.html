          const [timer, setTimer] = useState(0);
          const [isTimerActive, setIsTimerActive] = useState(false);
          const [recordDate, setRecordDate] = useState(new Date().toISOString().split('T')[0]);
          const [discomfortMap, setDiscomfortMap] = useState({});

          const [showSummary, setShowSummary] = useState(false);

          const [isTechniqueOpen, setIsTechniqueOpen] = useState(false);

          const chosenAltName = selectedAlternatives[ex.id];
          const currentAltObj = ex.alternatives && ex.alternatives.find(a => a.name === chosenAltName);
          
          const activeExName = chosenAltName || ex.name;
          const activeTechnique = currentAltObj ? currentAltObj.technique : ex.technique;
          const activeVideoUrl = currentAltObj ? currentAltObj.videoUrl : ex.videoUrl;
          const activeDonts = currentAltObj?.donts || ex.donts;

          const totalSets = getSetsForCurrentWeek(ex.sets);

            const lastWorkout = data.history.slice().reverse().find(w => w.programId === workout.id);

              const initialSets = {};
              Object.keys(lastWorkout.setsData).forEach(key => {
                initialSets[key] = { ...lastWorkout.setsData[key], done: false };
              });
              setSetsData(initialSets);
            }
          }, [workout.id, data.history]);

          useEffect(() => {
            let interval;
            if (isTimerActive && timer > 0) {
              interval = setInterval(() => setTimer(t => t - 1), 1000);
            } else if (timer === 0) {
              setIsTimerActive(false);
            }
            return () => clearInterval(interval);
          }, [isTimerActive, timer]);

          const startRest = (sec) => { setTimer(sec); setIsTimerActive(true); };

          const updateSet = (setNum, field, value) => {
            const key = `${ex.id}_${setNum}`;
            setSetsData(prev => ({
              ...prev,
              [key]: { weight: 0, reps: ex.repsMin, rir: 2, done: false, ...(prev[key] || {}), [field]: value }
            }));
          };

          const completeSet = (setNum) => {
            const key = `${ex.id}_${setNum}`;
            const cur = setsData[key] || { weight: 0, reps: ex.repsMin, rir: 2 };
            setSetsData(prev => ({ ...prev, [key]: { ...cur, done: true } }));
            
            const restTime = ex.category === 'base' ? 105 : 67;
            startRest(restTime);

            if (setNum < totalSets) {
              setActiveSetNum(setNum + 1);
            }

            setDiscomfortMap(prev => ({ ...prev, [ex.id]: val }));

            return `${m}:${rs < 10 ? '0' : ''}${rs}`;
          };

          const [form, setForm] = useState({});
          const [recordDate, setRecordDate] = useState(new Date().toISOString().split('T')[0]);

          const MEASUREMENT_FIELDS = [
            { id: 'weight', label: 'Вес', suffix: 'кг' },
            { id: 'fat', label: 'Процент жира', suffix: '%' },
            { id: 'chest', label: 'Над грудью', suffix: 'см' },
            { id: 'waist', label: 'Талия', suffix: 'см' },
            { id: 'bellyUpper', label: 'Верх живота', suffix: 'см' },
            { id: 'bellyLower', label: 'Низ живота', suffix: 'см' },
            { id: 'thighRight', label: 'Бедро (правое)', suffix: 'см' },
            { id: 'thighLeft', label: 'Бедро (левое)', suffix: 'см' },
            { id: 'armRight', label: 'Рука (правая)', suffix: 'см' },
            { id: 'armLeft', label: 'Рука (левая)', suffix: 'см' },
          ];

          const handleAddClick = () => {
            const latest = prog[prog.length - 1] || {};
            setForm({ ...latest });
            setRecordDate(new Date().toISOString().split('T')[0]);
            setIsAdding(true);
          };

          const getDiffElement = (currentVal, prevVal) => {
            if (!currentVal || !prevVal) return null;
            const diff = (currentVal - prevVal).toFixed(1);
            const num = parseFloat(diff);
            if (num === 0) return null;
            const isPositive = num > 0;
            const color = isPositive ? THEME.warning : THEME.success;
            return <span style={{ color }} className="text-[16px] font-bold ml-2">({isPositive ? `+${num}` : num})</span>;
          };

          if (isAdding) {
            return (
              <div style={{ backgroundColor: THEME.bg, color: THEME.textMilk }} className="pb-32 pt-8 px-5 animate-in fade-in font-sans">
                <div className="flex items-center justify-between mb-8">
                  <h1 className="text-[32px] font-bold">Новые замеры</h1>
                  <button onClick={() => setIsAdding(false)} style={{ color: THEME.textMuted }}><X size={28}/></button>
                </div>
                <Card className="space-y-5">
                  <div className="flex items-center justify-between pb-4 border-b border-white/10">
                    <span style={{ color: THEME.textMuted }} className="text-[15px] font-bold uppercase">Дата замера</span>
                    <input type="date" value={recordDate} onChange={e => setRecordDate(e.target.value)} style={{ backgroundColor: '#171A19', color: THEME.textMilk }} className="py-3 px-4 rounded-[14px] text-[16px] font-bold outline-none border border-white/10" />
                  </div>
                  {MEASUREMENT_FIELDS.map(f => (
                     <div key={f.id} className="flex items-center justify-between gap-4 border-b border-white/5 pb-4">
                       <label className="text-[18px] font-bold flex-1">{f.label}</label>
                       <div className="relative w-32">
                         <input type="number" step="0.1" value={form[f.id] || ''} onChange={e => setForm({...form, [f.id]: e.target.value})} style={{ backgroundColor: '#171A19', color: THEME.textMilk }} className="w-full rounded-[14px] py-3 px-3 outline-none text-right pr-9 font-bold text-[20px] border border-white/10" />
                         <span style={{ color: THEME.textMuted }} className="absolute right-3 top-1/2 -translate-y-1/2 text-[15px] font-bold">{f.suffix}</span>
                       </div>
                     </div>
                  ))}
                  <div className="pt-2">
                    <Button onClick={() => {
                      const toSave = {};
                      MEASUREMENT_FIELDS.forEach(f => { if (form[f.id] !== '' && !isNaN(form[f.id])) toSave[f.id] = Number(form[f.id]); });
                      if (Object.keys(toSave).length > 0) saveProgress(toSave, recordDate);
                      setIsAdding(false);
                    }}>Сохранить</Button>
                  </div>
                </Card>
              </div>
            );
          }

          const latest = prog[prog.length - 1] || {};
          const previous = prog.length > 1 ? prog[prog.length - 2] : {};

          return (
            <div style={{ backgroundColor: THEME.bg, color: THEME.textMilk }} className="pb-32 pt-8 px-5 animate-in fade-in font-sans space-y-6">
              <h1 className="text-[32px] font-bold mb-2">Прогресс и тело</h1>
              
              <div className="grid grid-cols-2 gap-4">
                <Card>
                  <div className="text-[14px] font-bold uppercase text-stone-400 mb-2">Вес</div>
                  <div className="text-[32px] font-bold tracking-tight">{latest.weight || '—'} кг {getDiffElement(latest.weight, previous.weight)}</div>
                </Card>
                <Card>
                  <div className="text-[14px] font-bold uppercase text-stone-400 mb-2">Талия</div>
                  <div className="text-[32px] font-bold tracking-tight">{latest.waist || '—'} см {getDiffElement(latest.waist, previous.waist)}</div>
                </Card>
              </div>

              <Card className="space-y-4">
                <h3 className="font-bold text-[15px] uppercase tracking-wider" style={{ color: THEME.gold }}>Все объемы тела</h3>
                <div className="space-y-4 text-[18px]">
                  {MEASUREMENT_FIELDS.filter(f => f.id !== 'weight' && f.id !== 'waist').map(f => (
                     <div key={f.id} className="flex justify-between items-center border-b border-white/5 pb-3">
                       <span style={{ color: THEME.textMuted }}>{f.label}</span>
                       <div className="font-bold">
                         {latest[f.id] ? `${latest[f.id]} ${f.suffix}` : '—'} 
                         {getDiffElement(latest[f.id], previous[f.id])}
                       </div>
                     </div>
                  ))}
                </div>
              </Card>

              <Button variant="secondary" onClick={handleAddClick}><Plus size={22}/> Добавить замеры</Button>
            </div>
          );
        };

        const MoreTab = () => {
          const { data, updateProfile, resetData, importData } = useContext(AppContext);

          const exportJSON = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `Recomp50_Backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
          };

          const handleFileUpload = (e) => {
            const fileReader = new FileReader();
            if (e.target.files[0]) {
              fileReader.readAsText(e.target.files[0], "UTF-8");
              fileReader.onload = (event) => {
                importData(event.target.result);
              };
            }
          };

          const fontSize = data.profile.fontSize || 'normal';

          return (
            <div style={{ backgroundColor: THEME.bg, color: THEME.textMilk }} className="pb-32 pt-8 px-5 animate-in fade-in font-sans space-y-6">
              <h1 className="text-[32px] font-bold mb-6">Настройки и справка</h1>
              
              <Card className="space-y-4">
                <h3 className="font-bold text-[15px] uppercase tracking-wider" style={{ color: THEME.gold }}>Размер интерфейса</h3>
                <div className="grid grid-cols-3 gap-3 pt-2">
                  {[
                    { id: 'normal', label: 'Обычный' },
                    { id: 'large', label: 'Крупный' },
                    { id: 'xlarge', label: 'Макс' }
                  ].map(sz => (
                    <button
                      key={sz.id}
                      onClick={() => updateProfile({ fontSize: sz.id })}
                      style={{
                        backgroundColor: fontSize === sz.id ? THEME.sage : '#171A19',
                        color: fontSize === sz.id ? THEME.bg : THEME.textMilk
                      }}
                      className="py-4 rounded-[14px] font-bold text-[16px] transition-colors border border-white/5"
                    >
                      {sz.label}
                    </button>
                  ))}
                </div>
              </Card>

              <Card className="space-y-4">
                <h3 className="font-bold text-[15px] uppercase tracking-wider" style={{ color: THEME.gold }}>Резервная копия</h3>
                <p className="text-[16px] text-stone-300 leading-relaxed">Экспортируйте ваши данные в файл JSON для сохранения или импортируйте на другое устройство.</p>
                <div className="flex gap-4 pt-3">
                  <Button variant="secondary" onClick={exportJSON}><Download size={22}/> Экспорт</Button>
                  <label className="flex-1 cursor-pointer">
                    <div style={{ backgroundColor: 'rgba(163,171,150,0.15)', color: THEME.textMilk }} className="w-full py-4 px-6 rounded-[16px] font-bold flex items-center justify-center gap-2 text-[18px] tracking-wide border border-transparent hover:bg-white/10 transition-colors">
                      <Upload size={22}/> Импорт
                    </div>
                    <input type="file" accept=".json" onChange={handleFileUpload} className="hidden" />
                  </label>
                </div>
              </Card>

              <Card className="space-y-5">
                <h3 className="font-bold text-[20px] uppercase tracking-wider flex items-center gap-3" style={{ color: THEME.gold }}>
                  <HelpCircle size={26}/> Справка о показателях
                </h3>
                <div className="text-[20px] text-stone-100 space-y-6 leading-[1.6] pt-3">
                  <p><b style={{ color: THEME.sage }}>Процент жира на весах:</b> Оценивайте только в динамике в одинаковых условиях, так как бытовые весы имеют погрешность.</p>
                  
                  <div className="p-5 rounded-[16px] bg-[#171A19] border border-white/5">
                    <b style={{ color: THEME.sage }} className="block mb-4 text-[22px]">RIR (Сколько в запасе?)</b>
                    {RIR_DESCRIPTION}
                  </div>
                  
                  <p><b style={{ color: THEME.sage }}>Локальное жиросжигание:</b> Жир не уходит только с рук или бедер; тело худеет системно.</p>
                </div>
              </Card>
              
              <Card onClick={resetData} className="border-red-900/30">
                <div className="flex items-center justify-center gap-3 text-red-400 font-bold text-[18px] py-2">
                  <Trash2 size={24} /> <span>Сбросить все данные приложения</span>
                </div>
              </Card>
            </div>
          );
        };

        const MainLayout = () => {
          const { activeTab, setActiveTab } = useContext(AppContext);
          if (activeTab === 'workout_active') return <ActiveWorkout />;
          if (activeTab === 'yoga_active') return <ActiveYoga />;
          if (activeTab === 'cardio_active') return <ActiveCardio />;

          return (
            <div style={{ backgroundColor: THEME.bg }} className="min-h-screen font-sans">
              <main style={{ backgroundColor: THEME.bg }} className="max-w-md mx-auto h-screen overflow-y-auto relative shadow-2xl">
                {activeTab === 'today' && <TodayTab />}
                {activeTab === 'workouts' && <WorkoutsTab />}
                {activeTab === 'nutrition' && <NutritionTab />}
                {activeTab === 'progress' && <ProgressTab />}
                {activeTab === 'more' && <MoreTab />}

                <nav style={{ backgroundColor: 'rgba(23,26,25,0.95)', borderColor: 'rgba(243,238,229,0.1)' }} className="fixed bottom-0 w-full max-w-md backdrop-blur-xl border-t flex justify-around items-center pb-safe pt-3 px-2 z-50 rounded-t-[24px]">
                  {[
                    { id: 'today', icon: Home, label: 'Сегодня' },
                    { id: 'workouts', icon: Activity, label: 'Тренировки' },
                    { id: 'nutrition', icon: Utensils, label: 'Питание' },
                    { id: 'progress', icon: TrendingUp, label: 'Прогресс' },
                    { id: 'more', icon: Settings, label: 'Ещё' }
                  ].map(tab => {
                    const isActive = activeTab === tab.id;
                    const Icon = tab.icon;
                    return (
                      <button 
                        key={tab.id} onClick={() => setActiveTab(tab.id)}
                        style={{ color: isActive ? THEME.sage : THEME.textMuted }}
                        className="flex flex-col items-center p-2 min-w-[64px] transition-colors"
                      >
                        <Icon size={26} strokeWidth={isActive ? 2.5 : 2} className="mb-1" />
                        <span className="text-[12px] font-bold tracking-wide">{tab.label}</span>
                      </button>
                    );
                  })}
                </nav>
              </main>
            </div>
          );
        };

        function App() {
          return (
            <AppProvider>
              <AppContent />
            </AppProvider>
          );
        }

        const AppContent = () => {
          const { data } = useContext(AppContext);
          return (
            <>
              {data.isFirstLaunch ? <Onboarding /> : <MainLayout />}
              <GlobalModal />
            </>
          );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
